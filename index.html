<!-- Avís d'errors (Sentry). Només a la web publicada, sense dades personals. -->
<script src="vendor/sentry.min.js"></script>
<script>
(function () {
  var host = location.hostname;
  if (!window.Sentry || host === 'localhost' || host === '127.0.0.1' || host === '') return;
  try {
    // Treu correus i paràmetres de l'adreça (p. ex. ?inv=) de qualsevol text
    var clean = function (str) {
      return typeof str !== 'string' ? str : str
        .replace(/[^\s@]+@[^\s@]+\.[^\s@]+/g, '[correu]')
        .replace(/([?&#])[^\s]*/g, '$1[…]');
    };
    Sentry.init({
      dsn: 'https://df615ca45e71ad17a44d5a6d14b25039@o4511413553922048.ingest.de.sentry.io/4512503694098512',
      environment: host.indexOf('github.io') !== -1 ? 'production' : host,
      sendDefaultPii: false,
      tracesSampleRate: 0,
      integrations: function (defaults) {
        // Sense registre de consola ni de clics: hi podria haver textos del xat o del diari
        return defaults.filter(function (i) { return i.name !== 'Breadcrumbs'; });
      },
      beforeSend: function (event) {
        delete event.user;
        if (event.request) { event.request.url = clean(event.request.url); delete event.request.cookies; delete event.request.headers; delete event.request.query_string; }
        if (event.message) event.message = clean(event.message);
        (event.exception && event.exception.values || []).forEach(function (v) { v.value = clean(v.value); });
        return event;
      },
    });
    window.EBReportError = function (error, info) {
      Sentry.captureException(error, { extra: { componentStack: info && info.componentStack ? String(info.componentStack).slice(0, 2000) : undefined } });
    };
  } catch (e) {}
})();
</script>

<script>
// Service worker + avís quan hi ha una versió nova
if ('serviceWorker' in navigator) {
  var hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!hadController) { hadController = true; return; }   // primera instal·lació: res a avisar
    if (document.querySelector('.eb-update')) return;
    var lang = 'ca'; try { lang = localStorage.getItem('elbosc-lang') || 'ca'; } catch (e) {}
    var T = { ca: ['Hi ha una versió nova', 'Actualitzar'], es: ['Hay una versión nueva', 'Actualizar'], en: ['A new version is ready', 'Update'] }[lang] || ['Hi ha una versió nova', 'Actualitzar'];
    var bar = document.createElement('div');
    bar.className = 'eb-update'; bar.setAttribute('role', 'status');
    var span = document.createElement('span'); span.textContent = T[0];
    var btn = document.createElement('button'); btn.textContent = T[1];
    btn.onclick = function () { location.reload(); };
    bar.appendChild(span); bar.appendChild(btn); document.body.appendChild(bar);
  });
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      // Comprova si hi ha versió nova en tornar a obrir l'app
      document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') reg.update().catch(function () {}); });
    }).catch(function () {});
  });
}
</script>

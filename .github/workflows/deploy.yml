name: Publicar a GitHub Pages

# Cada canvi a main: construeix dist/, passa les proves i el publica.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Instal·la eines
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: |
          npm install --prefix "$RUNNER_TEMP/eines" --no-save --no-package-lock playwright@1.48.2 esbuild@0.24.0
          echo "NODE_PATH=$RUNNER_TEMP/eines/node_modules" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/eines/node_modules/.bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/eines/node_modules/.bin/playwright" install --with-deps chromium
      - name: Construeix dist/
        run: node scripts/build.js
      - name: Proves contra dist/ (Supabase simulat)
        run: |
          python3 -m http.server 5001 --directory dist &
          until curl -s localhost:5001 > /dev/null; do sleep 1; done
          BASE=http://localhost:5001/ node tests/smoke.spec.js
      - name: Afegeix .nojekyll
        run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Proves

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Instal·la Playwright
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: |
          npm install --prefix "$RUNNER_TEMP/eines" --no-save --no-package-lock playwright@1.48.2 esbuild@0.24.0
          echo "NODE_PATH=$RUNNER_TEMP/eines/node_modules" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/eines/node_modules/.bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/eines/node_modules/.bin/playwright" install --with-deps chromium
      - name: Comprova la sintaxi del service worker
        run: node --check sw.js
      - name: Proves de fum (Supabase simulat)
        run: |
          python3 -m http.server 5000 &
          until curl -s localhost:5000 > /dev/null; do sleep 1; done
          node tests/smoke.spec.js
      - name: Versió optimitzada (dist/) i proves contra ella
        run: |
          node scripts/build.js
          python3 -m http.server 5001 --directory dist &
          until curl -s localhost:5001 > /dev/null; do sleep 1; done
          BASE=http://localhost:5001/ node tests/smoke.spec.js
